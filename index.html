.body{padding:12px 14px}

.body p strong{color:var(--blue)}
.pic{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;margin-top:8px;border:1px solid var(--line)}
.note{margin-top:22px;padding:14px;border-left:6px solid var(--yellow);background:#fff6d6;font-size:.92rem}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:.95rem;border:2px solid var(--blue)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--blue);color:#fff}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
tr.sum td{font-weight:700;background:#fff6d6}
.tips{list-style:none;padding:0;display:grid;gap:10px;margin-top:8px}
.tips li{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:10px 14px}

h3.sec{font-family:"Noto Serif TC",serif;font-size:1.7rem;color:var(--blue);margin:26px 0 8px}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:0 16px 30px}
@media(max-width:420px){.stop{grid-template-columns:60px 1fr}.ico{font-size:1.9rem}}
@media(prefers-reduced-motion:no-preference){main>section{animation:in .35s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/^(推薦原因：|交通：)/,"<strong>$1</strong>")}
function parseCSV(t){var r=[],row=[],f="",q=false,i,c;for(i=0;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}else f+=c}if(f!==""||row.length){row.push(f);r.push(row)}return r}
function fromSheet(t){var rows=parseCSV(t.replace(/^\uFEFF/,"")),h=rows.shift(),m={},days=[],by={};h.forEach(function(k,i){m[k.trim()]=i});
rows.forEach(function(r){function g(k){return (r[m[k]]||"").trim()}var id=g("day");if(!id||!g("name"))return;
var d=by[id];if(!d){d=by[id]={id:id,tab:id,date:"",title:"",sub:"",items:[]};days.push(d)}

return days}
